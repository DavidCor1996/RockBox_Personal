[package]
name = "ipod6g-android-installer"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Rockpod iPod 6G Android installer planner and image-only qualification engine"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10.9"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true

# Theme: iPone (Dark Mode Mod)
# Based on the iClassic Theme by Humberto Santana
# License: Creative Commons Attribution-Share Alike 3.0
# Updated: April 2026
#
# CFG File
#
wps: /.rockbox/wps/iPone.wps
sbs: /.rockbox/wps/iPone.sbs
fms: /.rockbox/wps/iPone.fms

# --- CRITICAL FIX FOR POWER MENU ---
# This forces the Galaxy wallpaper to load for all system popups
backdrop: /.rockbox/backdrops/Wallpaper.bmp

# This removes the "Grey Box" border entirely
menu frame: off

# This adds space between Shut Down/Reboot so they don't touch
line spacing: 8

# This forces the popup text to stay white and background to stay dark
ui viewport: -, -, -, -, 1, FFFFFF, 0F0E14
# -----------------------------------

background color: 0F0E14
album art: prefer image file
filetype colours: -
font: /.rockbox/fonts/24 iLike.fnt
foreground color: FFFFFF
iconset: /.rockbox/icons/iPone.bmp
line selector end color: 7C5AB3
line selector start color: 4D335F
line selector text color: FFFFFF
list separator color: 2B2833
scrollbar: off
selector type: bar (color)
show icons: on
statusbar: off
viewers iconset: -
battery display: graphic

# Lockscreen / Always On Display (AOD)
# - Enable the lockscreen by using the device's Hold switch.
# - For AOD (readable with backlight off), set: Settings -> General Settings -> Display -> LCD Settings -> Backlight on Hold = Off
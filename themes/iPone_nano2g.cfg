# Theme: iPone Nano 2G
# Compact 176x132 iPone port.
#
wps: /.rockbox/wps/iPone_nano2g.wps
sbs: /.rockbox/wps/iPone_nano2g.sbs
fms: /.rockbox/wps/iPone_nano2g.fms
backdrop: -
background color: 100F16
foreground color: F7F4FA
line selector start color: 2B2234
line selector end color: 9D7AE6
line selector text color: FCF9FF
list separator color: 1A1621
selector type: bar (gradient)
scrollbar: off
show icons: off
statusbar: off
ui viewport: -
list separator height: 1
font: /.rockbox/fonts/12-Adobe-Helvetica.fnt
iconset: /.rockbox/icons/tango_icons.12x12.bmp
viewers iconset: /.rockbox/icons/tango_icons_viewers.12x12.bmp
battery display: graphic
volume display: numeric
album art: prefer image file
filetype colours: -

# Lockscreen / AOD
# - Enable with the iPod hold switch.
backlight on button hold: on
